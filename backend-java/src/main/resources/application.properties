server.port=8080
spring.application.name=nexuspay-enterprise

# H2 In-Memory Database Configuration for High-Throughput Enterprise Testing
spring.datasource.url=jdbc:h2:mem:nexuspaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 Console for Database Inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Model Risk Management (MRM) Enterprise Configuration
mrm.model.id=MRM-FIN-FRAUD-v1.2
mrm.model.governance.status=OCC-SR-11-7-APPROVED
mrm.risk.threshold.review=65.0
mrm.risk.threshold.block=85.0
